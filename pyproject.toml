[project]
name = "bs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asv>=0.6.4",
    "av>=15.0.0",
    "cairosvg>=2.8.2",
    "drawsvg>=2.4.0",
    "ffmpeg-python>=0.2.0",
    "jaxlib>=0.7.2",
    "matplotlib>=3.10.1",
    "numpydantic>=1.7.0",
    "opencv-contrib-python>=4.11.0.86",
    "pandas>=2.3.1",
    "plotly>=6.2.0",
    "polars>=1.37.1",
    "psutil>=7.0.0",
    "pyarrow>=21.0.0",
    "pyceres>=2.5",
    "pydantic>=2.10.6",
    "pypylon==4.2.0",
    "pyyaml>=6.0.3",
    "rerun-sdk>=0.28.2",
    "scipy-stubs~=1.17.0",
    "pypylon>=4.2.0",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "toml>=0.10.2",
    "torch>=2.5.1", # Changed from 2.8.0 - CUDA wheels don't have 2.8.0 yet
    "tqdm>=4.67.1",
    "freemocap",
    "freemocap_blender_addon",
    "pandas-stubs~=3.0.3",
]

[tool.uv]
# Prioritize PyTorch CUDA index for torch packages
index-strategy = "unsafe-best-match"
# skellytracker[recommended] (pulled in via freemocap) hardcodes CUDA-only
# packages with no platform marker, which breaks resolution on macOS.
# Override them with a marker so they're skipped on darwin (Apple Silicon/Intel Mac).
override-dependencies = [
    "tensorrt; sys_platform != 'darwin'",
    "onnxruntime-gpu; sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12; sys_platform != 'darwin'",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12; sys_platform != 'darwin'",
    "nvidia-cufft-cu12; sys_platform != 'darwin'",
]

[[tool.uv.dependency-metadata]]
# tensorrt-cu13-libs uses a custom build backend ("wheel-stub") that downloads
# a platform-specific wheel at build time based on the *build host's* platform,
# not the resolution marker. This breaks universal resolution on macOS, which
# has no published wheel, even though the override above means it's never
# actually needed/installed there. Providing static metadata here lets uv skip
# building it during resolution.
name = "tensorrt-cu13-libs"
version = "11.0.0.114"
requires-dist = []

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform != 'darwin'" },
]
# freemocap = { path = "/home/jon-alien-pop/code_stuff/github/freemocap/project/freemocap", editable = true }
freemocap  = { git = "https://github.com/freemocap/freemocap", branch = "jon/development" }
freemocap_blender_addon  = { git = "https://github.com/freemocap/freemocap_blender_addon", branch = "development" }